<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="430" viewBox="0 0 1500 430" role="img" shape-rendering="crispEdges" aria-labelledby="rm-title rm-desc">
<title id="rm-title">Coffee roadmap</title>
<desc id="rm-desc">Horizontal timeline of five milestones. beta-v0.1, task execution, is available. Planned: beta-v0.2 full CPU, RAM and storage clustering; beta-v0.3 desktop app. The v1.0 goal is the first stable release. GPU clustering is planned after v1.0. These are goals, not shipped capabilities or dated commitments.</desc>
